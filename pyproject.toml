[project]
name = "gate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nahum Tadesse", email = "nahumtad123@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
gate = "gate:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
# Parallel by default; each worker gets its own test database (see conftest).
# Capped because past ~8 workers startup cost outweighs the gain here.
addopts = "-n auto --maxprocesses 8"

[tool.mypy]
# Knows that BaseSettings fields come from the environment, so Settings()
# needn't pass required ones like secret_key.
plugins = ["pydantic.mypy"]
